<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Falcon Dunes Gaggle (demo)</title>
<meta name="description" content="Falcon Dunes Gaggle weekly sign-ups, tee sheets and Stableford handicaps.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9B%B3%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#eef1ec;--panel:#fff;--ink:#1c2a24;--mute:#5d6b63;--line:#d3dad3;--green:#1f5a3f;--green-ink:#fff;--flag:#c4452d;--sand:#e8dfc4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--panel:#1b2620;--ink:#e6ece7;--mute:#9aa9a0;--line:#2e3d34;--green:#4c9a73;--green-ink:#0e1612;--flag:#e5775f;--sand:#2c3326}}
:root[data-theme="dark"]{--bg:#121a16;--panel:#1b2620;--ink:#e6ece7;--mute:#9aa9a0;--line:#2e3d34;--green:#4c9a73;--green-ink:#0e1612;--flag:#e5775f;--sand:#2c3326}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--green);color:var(--green-ink);padding:18px 16px 0}
.wrap{max-width:900px;margin:0 auto}
h1{font:700 26px/1.2 Georgia,"Times New Roman",serif;margin:0 0 2px}
header p{margin:0 0 12px;opacity:.85;font-size:14px}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{background:transparent;color:inherit;border:0;padding:10px 14px;font:inherit;font-size:15px;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap;opacity:.8}
nav button.on{background:var(--bg);color:var(--ink);opacity:1;font-weight:600}
main{padding:16px}
h2{font:700 21px/1.3 Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:120px;font-size:14px}
button.btn{background:var(--green);color:var(--green-ink);border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600}
button.alt{background:transparent;color:var(--green);border:1px solid var(--green);border-radius:6px;padding:7px 12px;cursor:pointer}
button.x{background:none;border:0;color:var(--flag);cursor:pointer;font-size:18px;padding:0 6px}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.list>div{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:13px}
.hc{font-variant-numeric:tabular-nums;font-weight:700;min-width:48px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.grid label{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
.grid label.on{background:var(--sand);border-color:var(--green)}
.gh{background:var(--sand);padding:6px 10px;border-radius:6px;font-weight:700;margin:12px 0 2px;display:flex;justify-content:space-between}
.empty{padding:22px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:10px}
label.f{display:block;font-size:14px;color:var(--mute);margin:8px 0 3px}
.note{background:var(--sand);padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:4px 16px;flex-wrap:wrap}
#info{margin-left:auto;margin-bottom:10px}
header button.x{color:inherit;font-size:14px;opacity:.85}
header .btn{background:var(--green-ink);color:var(--green)}
header .alt{color:var(--green-ink);border-color:var(--green-ink)}
</style>
</head>
<body>
<div style="background:#2b2b2b;color:#fff;padding:8px 12px;font:14px system-ui;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span>Demo with sample data. View as:</span>
<button onclick="demoAs('u3')">Player</button><button onclick="demoAs('u2')">Scheduler</button><button onclick="demoAs('u1')">Owner</button>
<label style="margin-left:auto"><input type="checkbox" checked onchange="demoOpen=this.checked;if(me)render()"> Sign-up window open</label></div>
<header><div class="wrap">
<div class="top"><div><h1>Falcon Dunes Gaggle</h1>
<p>Weekly sign-ups, tee sheets and Stableford handicaps</p></div><div id="info"></div></div>
<nav id="nav"></nav>
</div></header>
<main><div class="wrap" id="app"></div></main>
<div id="toast" role="status"></div>
<script>
/* PREVIEW ONLY: in-memory stand-in for Supabase with sample data */
var demoUser='u1',demoCb=null;
const supabase={createClient:()=>{
 const names=['Dave Miller','Sam Ortiz','Jim Hartley','Tom Reyes','Bill Nakamura','Chuck Dalton','Rick Sanders','Pete Callahan','Mike Ferris','Gary Lindstrom','Walt Brennan','Hank Doyle'];
 let P=names.map((n,i)=>({id:'u'+(i+1),name:n,role:i==0?'owner':i==1?'scheduler':'player',start_hcp:[null,null,22,18,25,30,16,21,27,19,24,29][i]==null?null:[0,0,22,18,25,30,16,21,27,19,24,29][i]})),E=null,S=null;
 function seed(){const c=comingSat(),d=n=>{const t=new Date(c+'T12:00:00');t.setDate(t.getDate()-n);return t.toISOString().slice(0,10)};E=[];S=[{id:1,next_game:null,ctp_hole:6,ctp_anchor:c}];
  [21,14,7].forEach((n,w)=>P.forEach((p,i)=>{if((i+w)%4!=3)E.push({game_date:d(n),user_id:p.id,grp:null,points:20+((i*7+w*5)%17)})}));
  [0,2,3,4,5,6,7,8,9].forEach((i,k)=>E.push({game_date:c,user_id:'u'+(i+1),grp:['1A','1A','1A','1A','1B','1B','1B','1B',null][k],points:null}))}
 const m=(e,f)=>Object.keys(f).every(k=>e[k]===f[k]);
 return {auth:{getSession:async()=>({data:{session:demoUser?{user:{id:demoUser}}:null}}),onAuthStateChange:f=>{demoCb=f;setTimeout(()=>f('INITIAL_SESSION'),0)},signOut:async()=>{demoUser=null;demoCb('SIGNED_OUT')},
  signInWithPassword:async()=>({error:{message:'Preview only: use the View as buttons above'}}),signUp:async()=>({error:{message:'Preview only: use the View as buttons above'}})},
 from:t=>{if(!E)seed();const a=()=>t==='profiles'?P:t==='settings'?S:E;return {
  select:async()=>({data:JSON.parse(JSON.stringify(a()))}),
  insert:async r=>(a().push({grp:null,points:null,...r}),{error:null}),
  delete:()=>({match:async f=>(E=E.filter(e=>!m(e,f)),{error:null})}),
  update:v=>({match:async f=>(a().filter(e=>m(e,f)).forEach(e=>Object.assign(e,v)),{error:null})}),
  upsert:async rows=>(rows.forEach(r=>Object.assign(E.find(x=>m(x,{game_date:r.game_date,user_id:r.user_id})),r)),{error:null})}},
 rpc:async(n,a)=>{if(n==='staff_emails')return {data:['golfer@example.com']};
  if(n==='owner_update_profile'){Object.assign(P.find(p=>p.id===a.uid),{name:a.n,role:a.r,start_hcp:a.h})}
  if(n==='owner_remove'){P=P.filter(p=>p.id!==a.uid);E=E.filter(e=>e.user_id!==a.uid)}return {error:null}}}}};
function demoAs(id){demoUser=id;tab='home';demoCb('SIGNED_IN')}
</script>
<script>
/* ====== STEP 1: paste your Supabase values here (Project Settings > API) ====== */
const SUPABASE_URL='demo', SUPABASE_KEY='demo';
const TEEBOXES=['1A','1B','18A','18B','17A','17B','16A','16B','15A','15B','14A','14B','13A','13B','12A','12B'];
const BEST_N=10;                       /* count the best N of the last 10 scores */
/* ============================================================================ */
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let uid=null,me=null,profiles=[],entries=[],tab='home',wk='',cfg=null,editing=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const staff=()=>me&&(me.role==='owner'||me.role==='scheduler'), isOwner=()=>me&&me.role==='owner';
const nm=id=>(profiles.find(p=>p.id===id)||{}).name||'?';
const forWeek=d=>entries.filter(e=>e.game_date===d);
const byName=(a,b)=>nm(a.user_id).localeCompare(nm(b.user_id));
const hf=h=>h==null?'–':h.toFixed(1);
/* Whole-number handicap (x.5 and up rounds up) and the tee it assigns */
const rh=(id,before)=>{const h=hcap(id,before);return h==null?null:Math.floor(h+0.5)};
const rhs=(id,before)=>{const r=rh(id,before);return r==null?'–':r};
const teeFor=r=>r==null?'':r>=35?'Panther':r>=24?'Viper':r>=14?'Eagle':'Phantom';
const pill=id=>`<span style="background:var(--sand);padding:2px 10px;border-radius:12px;font-size:13px;white-space:nowrap">${teeFor(rh(id,wk))||'No tee yet'}</span>`;
const fmt=k=>new Date(k+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
function toast(m){const t=$('toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3500)}
function err(e){if(e){toast(/row-level|policy/i.test(e.message)?'Not allowed. Sign-ups may be closed.':e.message);return true}}

/* ---- Arizona time time helpers (sign-up window: Mon 8:00 am to Thu 12:00 pm) ---- */
function la(){const o={};new Intl.DateTimeFormat('en-US',{timeZone:'America/Phoenix',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',hourCycle:'h23',weekday:'short'}).formatToParts(new Date()).forEach(x=>o[x.type]=x.value);
 const dow=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(o.weekday);
 return {dow,mins:dow*1440+(+o.hour)*60+(+o.minute),mon:new Date(Date.UTC(+o.year,+o.month-1,+o.day-dow))}}
function comingSat(){const t=la(),d=new Date(t.mon);d.setUTCDate(d.getUTCDate()+(t.dow<=5?5:12));return d.toISOString().slice(0,10)}
function windowOpen(d){d=d||nextGame();const t=la(),g=new Date(d+'T12:00:00Z'),mon=Date.UTC(g.getUTCFullYear(),g.getUTCMonth(),g.getUTCDate()-((g.getUTCDay()+6)%7));
 const rel=t.mins-Math.round((mon-t.mon.getTime())/86400000)*1440;return rel>=480&&rel<=3*1440+720}
/* ---- Next game date and closest-to-pin (CTP) hole, shared through the settings table ---- */
function todayAZ(){const t=la(),d=new Date(t.mon);d.setUTCDate(d.getUTCDate()+t.dow);return d.toISOString().slice(0,10)}
function nextGame(){const o=cfg&&cfg.next_game;return o&&o>=todayAZ()?o:comingSat()}
function ctpHole(){
 if(!cfg)return 1;const a=cfg.ctp_anchor||nextGame();
 const wks=Math.max(0,Math.floor((new Date(nextGame()+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/604800000));
 return ((cfg.ctp_hole-1+wks)%18)+1}
function infoBlock(){
 const d=nextGame(),can=staff(),pen=k=>can?` <button class="x" aria-label="Edit ${k==='game'?'next Gaggle date':'CTP hole'}" onclick="editing='${k}';render()">✎</button>`:'';
 const today=new Date().toLocaleDateString('en-US',{timeZone:'America/Phoenix',weekday:'short',month:'short',day:'numeric',year:'numeric'});
 const short=new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
 const bar=(save,extra)=>` <button class="btn" style="padding:4px 10px" onclick="${save}">Save</button> <button class="alt" style="padding:3px 10px" onclick="editing=null;render()">Cancel</button>${extra||''}`;
 let l2=`<div>Next Gaggle: <b>${short}</b>${pen('game')}</div>`,l3=`<div>CTP: <b>Hole ${ctpHole()}</b>${pen('ctp')}</div>`;
 if(editing==='game'&&can)l2=`<div>Next Gaggle:<br><input id="ng" type="date" value="${d}" aria-label="Next Gaggle date">${bar('saveGame()','<br><button class="alt" style="margin-top:4px;padding:3px 10px" onclick="saveGame(1)">Use the next Saturday</button>')}</div>`;
 if(editing==='ctp'&&can)l3=`<div>CTP hole:<br><select id="ch" aria-label="CTP hole">${Array.from({length:18},(_,i)=>`<option${i+1===ctpHole()?' selected':''}>${i+1}</option>`).join('')}</select>${bar('saveCtp()')}</div>`;
 return `<div style="text-align:right;font-size:14px;line-height:1.55"><div>${today}</div>${l2}${l3}</div>`}
async function saveGame(reset){
 const v=reset?null:($('ng').value||null);
 if(err((await sb.from('settings').update({next_game:v}).match({id:1})).error))return;
 editing=null;await load();wk=nextGame();render();toast('Next Gaggle updated')}
async function saveCtp(){
 if(err((await sb.from('settings').update({ctp_hole:+$('ch').value,ctp_anchor:nextGame()}).match({id:1})).error))return;
 editing=null;await load();render();toast('CTP updated')}


/* ---- Handicap: average of best BEST_N of the last 10 Stableford scores ---- */
function hcap(id,before){
 let s=entries.filter(e=>e.user_id===id&&e.points!=null&&(!before||e.game_date<before)).sort((a,b)=>a.game_date<b.game_date?-1:1).map(e=>e.points).slice(-10);
 if(!s.length){const p=profiles.find(x=>x.id===id);return p&&p.start_hcp!=null?+p.start_hcp:null}
 s.sort((a,b)=>b-a);s=s.slice(0,BEST_N);return s.reduce((a,b)=>a+b,0)/s.length}

/* ---- Auth + data ---- */
async function load(){
 const [a,b,c]=await Promise.all([sb.from('profiles').select('id,name,role,start_hcp'),sb.from('entries').select('*'),sb.from('settings').select('*')]);
 profiles=a.data||[];entries=b.data||[];cfg=(c.data||[])[0]||null;me=profiles.find(p=>p.id===uid)}
async function boot(){
 const {data}=await sb.auth.getSession();
 if(!data.session){uid=null;me=null;return authView()}
 uid=data.session.user.id;await load();
 if(!me){$('nav').innerHTML='<button onclick="sb.auth.signOut()">Log out</button>';return $('app').innerHTML='<div class="empty">Your profile was not found. Make sure the setup SQL was run, then log out and create the account again.</div>'}
 wk=wk||nextGame();render()}
sb.auth.onAuthStateChange(ev=>{if(ev!=='TOKEN_REFRESHED')setTimeout(boot,0)});
async function refresh(){await load();render()}
function authView(){
 $('nav').innerHTML='';$('info').innerHTML='';
 $('app').innerHTML='<div class="card" style="max-width:380px;margin:16px auto"><h2>Welcome</h2><p class="sub">Log in, or create an account with your name, email and a password.</p>'+
 '<label class="f" for="nmi">Your name (new accounts only)</label><input id="nmi" style="width:100%" autocomplete="name">'+
 '<label class="f" for="em">Email</label><input id="em" type="email" style="width:100%" autocomplete="email">'+
 '<label class="f" for="pw">Password (6+ characters)</label><input id="pw" type="password" style="width:100%" autocomplete="current-password">'+
 '<div class="row" style="margin-top:14px"><button class="btn" onclick="login()">Log in</button><button class="alt" onclick="register()">Create account</button></div></div>'}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});err(error)}
async function register(){
 const n=$('nmi').value.trim();if(!n)return toast('Please enter your name');
 const {data,error}=await sb.auth.signUp({email:$('em').value.trim(),password:$('pw').value,options:{data:{name:n}}});
 if(err(error))return;if(!data.session)toast('Check your email to confirm your account, then log in.')}

function go(t){tab=t;render()}
function render(){
 $('info').innerHTML=infoBlock();
 const T=[['home','Home'],['signup','Sign up'],['tee','Tee sheet'],['scores','My scores']];
 if(staff())T.push(['manage','Manage week']);if(isOwner())T.push(['members','Members']);
 $('nav').innerHTML=T.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 $('app').innerHTML=({home:vHome,signup:vSignup,tee:vTee,scores:vScores,manage:vManage,members:vMembers})[tab]()}

/* ---- Everyone ---- */
function vHome(){
 const d=nextGame(),es=forWeek(d),mine=es.some(e=>e.user_id===uid);
 return `<h2>Hi ${esc(me.name)}</h2><p class="sub">Signed in as ${me.role}</p><div class="card"><strong>Next game: ${fmt(d)}</strong>
 <p>${es.length} signed up. You are ${mine?'<b>in</b>':'not signed up yet'}.</p>
 <p class="mute">Sign-ups run Monday 8:00 am to Thursday 12:00 pm Arizona time. They are ${windowOpen()?'open now':'closed right now'}.</p>
 <div class="row"><button class="btn" onclick="go('signup')">Sign up</button><button class="alt" onclick="go('tee')">Tee sheet</button></div></div>
 <div class="card"><strong>Your handicap: ${hf(hcap(uid))}</strong></div>`}
function vSignup(){
 const d=nextGame(),mine=forWeek(d).some(e=>e.user_id===uid);
 return `<h2>Sign up</h2><p class="sub">${fmt(d)}</p><div class="card"><p>${mine?'You are signed up for this game.':'You are not signed up for this game.'}</p>`+
 (windowOpen()?`<button class="btn" onclick="${mine?'leave()':'join()'}">${mine?'Withdraw':'Sign me up'}</button>`:'<p class="mute">The sign-up window is closed. It runs Monday 8:00 am to Thursday 12:00 pm Arizona time.</p>')+'</div>'}
async function join(){if(!err((await sb.from('entries').insert({game_date:nextGame(),user_id:uid})).error))toast('You are signed up');refresh()}
async function leave(){if(!err((await sb.from('entries').delete().match({game_date:nextGame(),user_id:uid})).error))toast('Withdrawn');refresh()}
function grouped(d){const g={};forWeek(d).forEach(e=>(g[e.grp||'']=g[e.grp||'']||[]).push(e));
 const o=k=>k?TEEBOXES.indexOf(k):99;
 return Object.keys(g).sort((a,b)=>o(a)-o(b)).map(k=>[k,g[k].sort(byName)])}
function vTee(){
 const d=nextGame();
 const body=grouped(d).map(([k,a])=>`<div class="gh" style="gap:10px"><span class="grow">${k?'Tee box '+k:'No tee box yet'}</span><span style="width:70px">Tee</span><span style="min-width:48px;text-align:right">HC</span></div><div class="list" style="padding:0 10px">${a.map(e=>`<div><span class="grow">${esc(nm(e.user_id))}</span><span class="mute" style="width:70px">${teeFor(rh(e.user_id,d))}</span><span class="hc">${rhs(e.user_id,d)}</span></div>`).join('')}</div>`).join('');
 return `<h2>Tee sheet</h2><p class="sub">${fmt(d)}. Each player shows the tee they play from and their handicap.</p>`+(body||'<div class="empty">Nobody is signed up yet.</div>')}
function vScores(){
 const mine=entries.filter(e=>e.user_id===uid&&e.points!=null).sort((a,b)=>a.game_date<b.game_date?1:-1);
 return `<h2>My scores</h2><div class="card"><strong>Current handicap: ${hf(hcap(uid))}</strong><p class="mute" style="margin-bottom:0">Average of your best ${BEST_N} of your last 10 Stableford scores.</p></div>`+
 (mine.length?`<div class="card list">${mine.map(e=>`<div><span class="grow">${fmt(e.game_date)}</span><span class="hc">${e.points} pts</span></div>`).join('')}</div>`:'<div class="empty">No scores recorded yet.</div>')}

/* ---- Scheduler and owner: manage the week ---- */
function vManage(){
 const by={};forWeek(wk).forEach(e=>by[e.user_id]=e);const n=Object.keys(by).length,cnt={};
 Object.values(by).forEach(e=>{if(e.grp)cnt[e.grp]=(cnt[e.grp]||0)+1});
 const row=(p,e)=>`<div style="flex-wrap:wrap"><span class="grow">${esc(p.name)}</span><span class="hc" title="Handicap">${rhs(p.id,wk)}</span>${pill(p.id)}`+(e?
  `<select aria-label="Tee box for ${esc(p.name)}" onchange="upd('${p.id}','grp',this.value,1)"><option value="">Tee box</option>${TEEBOXES.map(t=>{const full=cnt[t]>=4&&e.grp!==t;return `<option value="${t}"${e.grp===t?' selected':''}${full?' disabled':''}>${t}${full?' (full)':''}</option>`}).join('')}</select>`:'')+'</div>';
 const box=(title,count,rows)=>`<div class="card" style="padding:0;overflow:hidden;margin-bottom:12px"><div class="gh" style="margin:0;border-radius:0"><span>${title}</span><span>${count}</span></div><div class="list" style="padding:0 14px">${rows}</div></div>`;
 const pr=id=>profiles.find(p=>p.id===id);
 const sections=grouped(wk).map(([k,a])=>box(k?'Tee box '+k:'Playing, no tee box yet',k?a.length+' / 4':a.length,a.map(e=>row(pr(e.user_id),e)).join(''))).join('');
 return `<h2>Manage week</h2><p class="sub">Everyone who signed up is listed. Pick a tee box (up to 4 players each). Each player shows a whole-number handicap and the tee that handicap plays from.</p>
 <div class="row" style="margin-bottom:10px"><label for="wk"><strong>Game date</strong></label><input id="wk" type="date" value="${wk}" onchange="wk=this.value||wk;render()"><span><b>${n}</b> playing</span></div>
 <div class="row" style="margin-bottom:14px"><button class="btn" onclick="autoGroup()">Auto-assign by handicap</button><button class="alt" onclick="emailAll('signup')">Email sign-up request</button><button class="alt" onclick="emailAll('tee')">Email tee sheet</button></div>
 ${sections||'<div class="empty">Nobody has signed up for this date yet.</div>'}`}
async function togglePlayer(id,on){
 const q=on?sb.from('entries').insert({game_date:wk,user_id:id}):sb.from('entries').delete().match({game_date:wk,user_id:id});
 err((await q).error);refresh()}
async function upd(id,f,v,re){
 if(f==='grp'&&v&&forWeek(wk).filter(e=>e.grp===v&&e.user_id!==id).length>=4){toast('Tee box '+v+' is full (4 players)');return render()}
 const val=v===''?null:(f==='grp'?v:+v),e=entries.find(x=>x.game_date===wk&&x.user_id===id);if(e)e[f]=val;
 err((await sb.from('entries').update({[f]:val}).match({game_date:wk,user_id:id})).error);if(re)render()}
async function autoGroup(){
 const es=forWeek(wk).sort((a,b)=>(hcap(b.user_id,wk)||0)-(hcap(a.user_id,wk)||0));if(!es.length)return;
 const n=Math.ceil(es.length/4);es.forEach((e,i)=>{const r=Math.floor(i/n),c=i%n;e.grp=TEEBOXES[r%2?n-1-c:c]||null});
 err((await sb.from('entries').upsert(es)).error);render();toast('Tee boxes assigned')}
async function emailAll(kind){
 const {data,error}=await sb.rpc('staff_emails');if(err(error))return;if(!data||!data.length)return toast('No email addresses found');
 const site=location.href.split('#')[0];
 const body=kind==='signup'?`Hi Gaggle,\n\nSign-ups for ${fmt(wk)} are open until Thursday at 12:00 pm Arizona time. Log in and sign up here:\n${site}\n\n${me.name}`:
 `Hi Gaggle,\n\nTee sheet for ${fmt(wk)}:\n\n`+grouped(wk).map(([k,a])=>(k?'TEE BOX '+k:'NO TEE BOX YET')+'\n'+a.map(e=>`  ${nm(e.user_id)} | Handicap ${rhs(e.user_id,wk)} | ${teeFor(rh(e.user_id,wk))||'tee TBD'} tees`).join('\n')).join('\n\n')+`\n\nAll handicaps are on the website: ${site}\n\n${me.name}`;
 const a=document.createElement('a');a.href='mailto:?bcc='+encodeURIComponent(data.join(','))+'&subject='+encodeURIComponent(kind==='signup'?`Falcon Dunes Gaggle: are you in for ${fmt(wk)}?`:`Falcon Dunes Gaggle tee sheet: ${fmt(wk)}`)+'&body='+encodeURIComponent(body);a.click()}

/* ---- Owner: members ---- */
function vMembers(){
 const rows=profiles.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<div style="flex-wrap:wrap">
  <input id="n${p.id}" aria-label="Name" value="${esc(p.name)}" class="grow">
  <select id="r${p.id}" aria-label="Role for ${esc(p.name)}">${['player','scheduler','owner'].map(r=>`<option${p.role===r?' selected':''}>${r}</option>`).join('')}</select>
  <input id="h${p.id}" type="number" step="0.1" placeholder="Start hcp" aria-label="Starting handicap" style="width:92px" value="${p.start_hcp==null?'':p.start_hcp}">
  <button class="alt" onclick="saveMember('${p.id}')">Save</button>${p.id===uid?'':`<button class="x" aria-label="Remove ${esc(p.name)}" onclick="removeMember('${p.id}')">×</button>`}</div>`).join('');
 return `<h2>Members</h2><p class="sub">${profiles.length} accounts. Give someone the scheduler role to let them run the weekly tee sheet and scores. The starting handicap is used until they have scores.</p><div class="card list">${rows}</div>`}
async function saveMember(id){
 const h=$('h'+id).value;
 if(!err((await sb.rpc('owner_update_profile',{uid:id,n:$('n'+id).value.trim(),r:$('r'+id).value,h:h===''?null:+h})).error))toast('Saved');refresh()}
async function removeMember(id){
 if(!confirm('Remove '+nm(id)+' and all of their scores? This cannot be undone.'))return;
 err((await sb.rpc('owner_remove',{uid:id})).error);refresh()}
</script>
